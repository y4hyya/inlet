      <title id="intent-lifecycle-dark-title">Intent lifecycle</title>
      <desc id="intent-lifecycle-dark-desc">State machine of an Inlet deposit intent from created through funded, swept, attested and executed, with claimable USDC when an adapter fails, a refund path after the deadline when funds arrived, and expiry when nothing arrived.</desc>
