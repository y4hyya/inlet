      <title id="deployment-dark-title">Where Inlet runs on testnet</title>
      <desc id="deployment-dark-desc">Deployment diagram placing the Inlet widget in the user's browser, the playground and the relayer on Azure in West Europe, Circle's attestation and Gateway APIs, the Inlet hub on Arc testnet, and the receivers and adapters on Arbitrum, Base and Unichain Sepolia, with the network paths between them.</desc>
