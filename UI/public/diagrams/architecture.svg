<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-dark-title architecture-dark-desc">
      <title id="architecture-dark-title">How a deposit moves through Inlet</title>
      <desc id="architecture-dark-desc">Architecture diagram showing USDC leaving a user's wallet or Gateway balance on the source chain, landing at a per intent deposit address on Arc, being swept by the Inlet hub through CCTP to the receiver and adapter on the destination chain, where the protocol position is delivered, with the relayer and Circle attestation in the middle and the refund path back to the wallet.</desc>
