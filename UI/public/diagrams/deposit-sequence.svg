      <title id="deposit-sequence-dark-title">One deposit, end to end</title>
      <desc id="deposit-sequence-dark-desc">Sequence diagram of an Inlet deposit: the wallet registers an intent with the relayer, funds the deposit address on Arc through either a signed Gateway burn intent or a CCTP burn, the relayer sweeps the hub, Circle attests the burn, and the destination receiver executes the adapter so the position reaches the user.</desc>
